name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # same as the dashboard container
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check --line-length 140 services styles tests pages/home.py pages/server.py pages/media.py pages/network.py app.py
      - run: pytest -q
